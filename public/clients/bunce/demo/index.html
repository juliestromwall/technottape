<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Bunce Hub — Demo</title>
<meta name="description" content="Interactive prototype of an all-in-one platform for Bunce Performing Arts.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#18355E">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- prototype control strip -->
<div class="demobar" id="demobar">
  <div class="demobar__in">
    <span class="demobar__tag">Prototype</span>
    <label class="demobar__lbl" for="roleSel">Viewing as</label>
    <select id="roleSel" class="demobar__sel"></select>
    <span class="demobar__hint" id="roleHint"></span>
    <button class="demobar__reset" type="button" id="resetBtn">Reset demo</button>
  </div>
</div>

<div class="shell">
  <aside class="side" id="side">
    <a class="side__logo" href="#/home" aria-label="Bunce Hub home">
      <img src="assets/logo.png" alt="Bunce Performing Arts">
    </a>
    <nav class="side__nav" id="navLinks" aria-label="Main"></nav>
    <div class="side__foot">
      <div class="who" id="who"></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="menubtn" type="button" id="menuBtn" aria-label="Menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="topbar__ctx">
        <span class="topbar__dot"></span>
        <b>Matilda</b>
        <span class="topbar__sep">·</span>
        <span>Summer 2026</span>
      </div>
      <div class="topbar__right">
        <button class="bellbtn" type="button" id="bellBtn" aria-label="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <b id="bellCount">0</b>
        </button>
      </div>

      <div class="notifpanel" id="notifPanel" hidden>
        <div class="notifpanel__hd">
          <b>Notifications</b>
          <button type="button" id="markAll" class="linkbtn">Mark all read</button>
        </div>
        <div id="notifList"></div>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <footer class="foot">
      <div class="foot__in">
        <p><b>This is an interactive prototype</b>, not live software. Data is made up, resets when you click "Reset demo", and never leaves your browser. No real payments, emails, or notifications are sent.</p>
        <p class="foot__by">Built for Bunce Performing Arts by <a href="mailto:hello@juliestromwall.com">Julie Stromwall</a></p>
      </div>
    </footer>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
